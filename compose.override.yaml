services:
  app:
    volumes:
      - .:/var/www/html

  queue:
    volumes:
      - .:/var/www/html

  scheduler:
    volumes:
      - .:/var/www/html

  web:
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    ports:
      - "5432:5432"

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www/html
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
